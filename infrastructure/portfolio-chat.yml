"},{name:"PL/SQL"},{name:"SQL",level:80},{name:"TSQL",level:80}]},{title:"AI & GenAI",skills:[{name:"Multi-agent systems"},{name:"Model Context Protocol (MCP)"},{name:"RAG"},{name:"LLM orchestration"},{name:"LLM evaluation"},{name:"OpenAI APIs & Agents"},{name:"Azure OpenAI"},{name:"Microsoft AutoGen"},{name:"Azure AI Search"},{name:"Flowise"},{name:"VannaAI"}]},{title:"Database",skills:[{name:"Microsoft Sql Server",level:80},{name:"Oracle 9g",level:60},{name:"MySql",level:90},{name:"Redis (NO-SQL)",level:50},{name:"Postgres",level:80},{name:"Snowflake",level:50}]},{title:"Frontend",skills:[{name:"Angular",level:60},{name:"React",level:80},{name:"RxJS",level:80},{name:"AEM",level:40}]},{title:"Backend",skills:[{name:"Flask",level:60},{name:"ExpressJS",level:60},{name:"SqlAlchemy",level:50},{name:"Kafka",level:40}]},{title:"Infrastructure",skills:[{name:"AWS",level:50},{name:"EC2",level:60},{name:"RDS",level:70},{name:"Elastic Beanstalk",level:60},{name:"S3",level:90},{name:"SES",level:80},{name:"Route 53",level:80},{name:"SQS",level:50},{name:"Docker"},{name:"Kubernetes"},{name:"Jenkins"},{name:"CircleCI"},{name:"Harness"}]},{title:"SASS/ERP/Tools",skills:[{name:"Salesforce (SFDC)",level:50},{name:"SSIS",level:80},{name:"Walkme",level:90},{name:"Zapier",level:90},{name:"JIRA",level:80},{name:"Confluence",level:70},{name:"Tableau",level:60},{name:"Mulesoft",level:50},{name:"Active Directory (AD)",level:50},{name:"OKTA",level:50}]},{title:"Testing",skills:[{name:"Selenium",level:60},{name:"Perfecto",level:60},{name:"JAWS (ADA testing)",level:50}]}],oe=[{title:"Smart Pin",visual:"smart-pin",status:"Stealth mode",description:"Building a smart pin. Currently in stealth mode, with more to share when it\u2019s ready.",category:"Product development",link:null,accomplishments:[]},{title:"Skirmesh",visual:"skirmesh",status:"Exited - Sold Equity",description:"Architected and redesigned the technical and product architecture to make it a viable product",category:"IRL Gaming SAA