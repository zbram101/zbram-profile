AWSTemplateFormatVersion: '2010-09-09'
Description: Server-side portfolio chat API. The OpenAI credential is resolved from Secrets Manager during deployment.

Parameters:
  OpenAISecretName:
    Type: String
    Default: OAIprofile
    MaxLength: 512
    AllowedPattern: '[a-zA-Z0-9/_+=.@-]+'
    Description: Existing server-side Secrets Manager secret containing an OpenAI key from the saved agent's project.
  SavedAgentId:
    Type: String
    Default: ''
    MaxLength: 64
    AllowedPattern: '(^$|[a-zA-Z0-9_-]+)'
    Description: Saved OpenAI portfolio agent ID. When set, new sessions use its portal configuration.
  AgentModel:
    Type: String
    Default: gpt-6-astra
    AllowedPattern: '[a-zA-Z0-9._-]+'
    Description: Agents API model enabled for the OpenAI project.
  ChatBackend:
    Type: String
    Default: agents
    AllowedValues: [agents, responses]
    Description: Use responses for a temporary rollback to the previous chat.
  BookingUrl:
    Type: String
    Default: ''
    MaxLength: 1000
    AllowedPattern: '(^$|https://[^\s]+)'
    Description: Public booking page URL. Leave empty to prepare LinkedIn meeting requests.
  MeetingDetails:
    Type: String
    Default: ''
    MaxLength: 1200
    Description: Owner-approved meeting length, time zone, hours, and confirmation rules.
  GoogleCalendarSecretName:
    Type: String
    Default: ''
    MaxLength: 512
    AllowedPattern: '(^$|[a-zA-Z0-9/_+=.@-]+)'
    Description: Existing Secrets Manager secret name containing clientId, clientSecret, refreshToken, and calendarId. Leave blank to disable Google Calendar.
  GoogleCalendarRules:
    Type: String
    Default: ''
    MaxLength: 2000
    Description: Owner-approved scheduling rules as JSON. Leave blank until meeting hours are approved.

Conditions:
  HasGoogleCalendar: !Not [!Equals [!Ref GoogleCalendarSecretName, '']]

Resources:
  ChatRateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-chat'
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex

  VisitorAnalyticsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
        - AttributeName: visitorHash
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
        - AttributeName: visitorHash
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex

  ChatRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex
      Policies:
        - PolicyName: WriteChatLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ChatLogGroup.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt VisitorAnalyticsTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ChatRateLimitTable.Arn

  ChatFunction:
    Type: AWS::Lambda::Function
    DependsOn: ChatLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-chat'
      Description: Answers portfolio questions with OpenAI, using a server-side Secrets Manager reference.
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt ChatRole.Arn
      MemorySize: 256
      Timeout: 25
      ReservedConcurrentExecutions: 3
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex
      Environment:
        Variables:
          OPENAI_SECRET: !Sub '{{resolve:secretsmanager:${OpenAISecretName}:SecretString}}'
          OPENAI_MODEL: gpt-4.1-mini
          OPENAI_AGENT_MODEL: !Ref AgentModel
          OPENAI_AGENT_ID: !Ref SavedAgentId
          CHAT_BACKEND: !Ref ChatBackend
          BOOKING_URL: !Ref BookingUrl
          MEETING_DETAILS: !Ref MeetingDetails
          GOOGLE_CALENDAR_SECRET: !If [HasGoogleCalendar, !Sub '{{resolve:secretsmanager:${GoogleCalendarSecretName}:SecretString}}', '']
          GOOGLE_CALENDAR_RULES: !Ref GoogleCalendarRules
          CHAT_RATE_TABLE: !Ref ChatRateLimitTable
          VISITOR_TABLE: !Ref VisitorAnalyticsTable
      Code:
        ZipFile: |
          var je=Object.create;var G=Object.defineProperty;var qe=Object.getOwnPropertyDescriptor;var Re=Object.getOwnPropertyNames;var Me=Object.getPrototypeOf,ze=Object.prototype.hasOwnProperty;var Be=(e,t)=>{for(var n in t)G(e,n,{get:t[n],enumerable:!0})},ne=(e,t,n,a)=>{if(t&&typeof t=="object"||typeof t=="function")for(let o of Re(t))!ze.call(e,o)&&o!==n&&G(e,o,{get:()=>t[o],enumerable:!(a=qe(t,o))||a.enumerable});return e};var Ue=(e,t,n)=>(n=e!=null?je(Me(e)):{},ne(t||!e||!e.__esModule?G(n,"default",{value:e,enumerable:!0}):n,e)),He=e=>ne(G({},"__esModule",{value:!0}),e);var wt={};Be(wt,{handler:()=>yt});module.exports=He(wt);var te=Ue(require("crypto"),1),C=require("@aws-sdk/client-dynamodb");var We=[{company:"Thermo Fisher Scientific",role:"Senior AI Solutions Manager",additionalRole:"Staff AI Software Engineer",aliases:["thermo","thermo fisher"],period:"Nov 2023 \u2013 Present",current:!0,description:"Leading teams that turn enterprise AI into measurable operational impact, from multi-agent automation and RAG to MCP platforms and AI adoption.",highlights:[{value:"30%",label:"less excess & obsolete inventory"},{value:"60%",label:"fewer unnecessary onsite visits"},{value:"30+",label:"MCP servers in the pipeline"}],responsibilities:["Led a team of 8 engineers building multi-agent systems, Model Context Protocol (MCP) integrations, and retrieval-augmented generation (RAG) solutions for intelligent automation.","Designed and deployed a multi-agent framework using Microsoft AutoGen that reduced excess and obsolete manufacturing inventory by 30%.","Architected and led development of a RAG-powered decision-support tool combining instrument manuals with historical service data. It reduced unnecessary onsite visits by 60% and saved over $1M annually in field service costs.","Created a reusable MCP archetype and framework that enabled engineering teams across business units to build integrations, establishing a pipeline of 30+ MCP servers.","Built and maintained an int