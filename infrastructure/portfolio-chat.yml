  ChatApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      Tags:
        Application: zbramprofile
        ManagedBy: Codex
      CorsConfiguration:
        AllowOrigins:
          - https://bharadwajramachandran.com
          - https://www.bharadwajramachandran.com
          - https://codex-modernize-portfolio.dn8ysw76ubukd.amplifyapp.com
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 86400

  ChatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ChatApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 25000

  ChatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ChatApi
      RouteKey: 'POST /chat'
      Target: !Sub 'integrations/${ChatIntegration}'

  ChatStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ChatApi
      RouteKey: 'GET /chat'
      Target: !Sub 'integrations/${ChatIntegration}'

  AnalyticsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ChatApi
      RouteKey: 'POST /event'
      Target: !Sub 'integrations/${ChatIntegration}'

  ChatStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ChatApi
      StageName: '$default'
      AutoDeploy: true
      Tags:
        Application: zbramprofile
        ManagedBy: Codex
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  AllowApiGatewayToInvokeChat:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatApi}/*/*'

  AnalyticsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-analytics'
      DashboardBody: !Sub |
        {
          "start": "-PT336H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# Portfolio analytics\nDaily profile activity plus blog views and link clicks. Anonymous browser IDs estimate visitors; they do not identify people. Detailed tables use the selected range within 14 days of retained logs. Tracking begins with this release; blocked analytics and bots affect counts. No IP addresses, query strings, or chat content are logged."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Daily visits and unique visitors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 86400,
                "stat": "Sum",
                "metrics": [
                  [
                    "PortfolioAnalytics",
                    "PageViews",
                    "Site",
                    "bharadwajramachandran.com",
                    {
                      "label": "Visits"
                    }
                  ],
                  [
                    "PortfolioAnalytics",
                    "UniqueVisitors",
                    "Site",
                    "bharadwajramachandran.com",
                    {
                      "label": "Unique visitors"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 2,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Assistant usage and errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 86400,
                "stat": "Sum",
                "metrics": [
                  [
                    "PortfolioAnalytics",
                    "ChatMessages",
                    "Site",
                    "bharadwajramachandran.com",
                    {
                      "label": "Chat messages"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Chat API health",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${ChatFunction}",
                    {
                      "label": "Requests"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Chat API errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${ChatFunction}",
                    {
                      "label": "Errors"
                    }
                  ]
                ]
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Blog audience in selected range (up to 14 days)",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AWS::StackName}-chat' | filter Site = 'bharadwajramachandran.com' | filter EventType = 'page_view' and (Page = '/blog/' or ispresent(ArticleSlug)) | stats count(*) as Views, count_distinct(VisitorHash) as EstimatedVisitors"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Daily blog views and link clicks",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 86400,
                "stat": "Sum",
                "metrics": [
                  [
                    "PortfolioAnalytics",
                    "BlogViews",
                    "Site",
                    "bharadwajramachandran.com",
                    {
                      "label": "Blog views (index + articles)"
                    }
                  ],
                  [
                    "PortfolioAnalytics",
                    "ArticleViews",
                    "Site",
                    "bharadwajramachandran.com",
                    {
                      "label": "Article views"
                    }
                  ],
                  [
                    "PortfolioAnalytics",
                    "BlogLinkClicks",
                    "Site",
                    "bharadwajramachandran.com",
                    {
                      "label": "Blog link clicks"
                    }
                  ]
                ]
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 20,
              "width": 24,
              "height": 7,
              "properties": {
                "title": "Which articles people read",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AWS::StackName}-chat' | filter Site = 'bharadwajramachandran.com' | filter EventType = 'page_view' and ispresent(ArticleSlug) | stats count(*) as Views, count_distinct(VisitorHash) as EstimatedReaders by ArticleTitle, Page | sort Views desc | limit 100"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 27,
              "width": 24,
              "height": 8,
              "properties": {
                "title": "What readers click (by page and destination)",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AWS::StackName}-chat' | filter Site = 'bharadwajramachandran.com' | filter EventType = 'link_click' | stats count(*) as Clicks, count_distinct(VisitorHash) as EstimatedVisitors by PageTitle, Page, LinkLabel, LinkTarget | sort Clicks desc | limit 100"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 35,
              "width": 24,
              "height": 7,
              "properties": {
                "title": "Recent blog activity",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/${AWS::StackName}-chat' | filter Site = 'bharadwajramachandran.com' | filter EventType in ['page_view', 'link_click'] and (Page = '/blog/' or ispresent(ArticleSlug)) | fields @timestamp, EventType, PageTitle, Page, LinkLabel, LinkTarget | sort @timestamp desc | limit 50"
              }
            }
          ]
        }

Outputs:
  ChatApiUrl:
    Description: Public HTTPS endpoint for the portfolio chat route.
    Value: !Sub 'https://${ChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/chat'
  AnalyticsDashboardName:
    Description: CloudWatch dashboard for daily visits, unique visitors, and chat activity.
    Value: !Ref AnalyticsDashboard
