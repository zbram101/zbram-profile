at usage and estimated cost reporting","Developed the MVP with React, TypeScript, FastAPI, and PostgreSQL, containerized with Docker and deployed on AWS ECS"]},{title:"goLoadout",aliases:["go loadout","go loadouts","goloadouts"],visual:"loadout",status:null,description:"Your tactical gaming identity follows you from the screen to the field.",category:"Gaming & Digital Identity",link:"https://goloadout.bharadwajramachandran.com/",accomplishments:["Connecting real-life gaming with your online persona","Putting your personal gaming identity at the center of the experience"]}];function re(e){let t=e.toLowerCase(),a=oe.find(n=>[n.title,...n.aliases||[]].some(o=>t.includes(o.toLowerCase())));return a?`**${a.title}**${a.status?` (${a.status})`:""}

