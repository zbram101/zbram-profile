"},{name:"PL/SQL"},{name:"SQL",level:80},{name:"TSQL",level:80}]},{title:"AI & GenAI",skills:[{name:"Multi-agent systems"},{name:"Model Context Protocol (MCP)"},{name:"RAG"},{name:"LLM orchestration"},{name:"LLM evaluation"},{name:"OpenAI APIs & Agents"},{name:"Azure OpenAI"},{name:"Microsoft AutoGen"},{name:"Azure AI Search"},{name:"Flowise"},{name:"VannaAI"}]},{title:"Database",skills:[{name:"Microsoft Sql Server",level:80},{name:"Oracle 9g",level:60},{name:"MySql",level:90},{name:"Redis (NO-SQL)",level:50},{name:"Postgres",level:80},{name:"Snowflake",level:50}]},{title:"Frontend",skills:[{name:"Angular",level:60},{name:"React",level:80},{name:"RxJS",level:80},{name:"AEM",level:40}]},{title:"Backend",skills:[{name:"Flask",level:60},{name:"ExpressJS",level:60},{name:"SqlAlchemy",level:50},{name:"Kafka",level:40}]},{title:"Infrastructure",skills:[{name:"AWS",level:50},{name:"EC2",level:60},{name:"RDS",level:70},{name:"Elastic Beanstalk",level:60},{name:"S3",level:90},{name:"SES",level:80},{name:"Route 53",level:80},{name:"SQS",level:50},{name:"Docker"},{name:"Kubernetes"},{name:"Jenkins"},{name:"CircleCI"},{name:"Harness"}]},{title:"SASS/ERP/Tools",skills:[{name:"Salesforce (SFDC)",level:50},{name:"SSIS",level:80},{name:"Walkme",level:90},{name:"Zapier",level:90},{name:"JIRA",level:80},{name:"Confluence",level:70},{name:"Tableau",level:60},{name:"Mulesoft",level:50},{name:"Active Directory (AD)",level:50},{name:"OKTA",level:50}]},{title:"Testing",skills:[{name:"Selenium",level:60},{name:"Perfecto",level:60},{name:"JAWS (ADA testing)",level:50}]}],ae=[{title:"Smart Pin",visual:"smart-pin",status:"Stealth mode",description:"Building a smart pin. Currently in stealth mode, with more to share when it\u2019s ready.",category:"Product development",link:null,accomplishments:[]},{title:"Skirmesh",visual:"skirmesh",status:"Exited - Sold Equity",description:"Architected and redesigned the technical and product architecture to make it a viable product",category:"IRL Gaming SAAS",link:"https://play.skirmesh.net/public/home",accomplishments:["Revamped the project with software engineering concepts like web sockets and APIs","Aided in transforming the project into a money-making business","Acquired initial customers to kickstart the project"]},{title:"Fiji Fry House",visual:"fiji",status:"Active",description:"Managing IT infrastructure, online presence, and operational efficiency for a friend's restaurant",category:"Restaurant",link:"https://fijifryhouse.com/",accomplishments:["Providing IT support and management for the restaurant","Enhancing online presence for the restaurant","Improving operational efficiency through IT solutions"]},{title:"trytherapy.ai",visual:"therapy",status:"#2 on Product Hunt",description:"Built TherapyAI end to end, an iOS AI companion offering 24/7 conversations and personalized support to help people reflect, feel heard, and better understand their emotions",category:"iOS \xB7 AI Mental Wellness",link:"https://www.trytherapy.ai/",accomplishments:["Created conversations that remember previous sessions, making support more personal over time","Provided tailored guidance and exercises based on each person's needs","Built a space to vent, explore feelings, and reflect on the roots of stress and anxiety","Reached #2 on Product Hunt"]},{title:"Context Platform",visual:"context",status:"Active \u2014 MVP",description:"Building a governed context platform that connects shared business definitions to AI-assisted data analysis, with validated queries and traceable answers.",category:"AI & Data Platform",link:"https://context.bharadwajramachandran.com",accomplishments:["Built a versioned definition registry with independent reviews, release promotion, rollback, and an audit trail","Connected conversational analysis to validated, read-only queries over AdventureWorks, with query evidence, Python analysis, and downloadable charts and CSVs","Added interactive relationship exploration, API and MCP access, and publisher-only chat usage and estimated cost reporting","Developed the MVP with React, TypeScript, FastAPI, and PostgreSQL, containerized with Docker and deployed on AWS ECS"]},{title:"goLoadout",aliases:["go loadout","go loadouts","goloadouts"],visual:"loadout",status:null,description:"Your tactical gaming identity follows you from the screen to the field.",category:"Gaming & Digital Identity",link:"https://goloadout.bharadwajramachandran.com/",accomplishments:["Connecting real-life gaming with your online persona","Putting your personal gaming identity at the center of the experience"]}];function oe(e){let t=e.toLowerCase(),n=ae.find(a=>[a.title,...a.aliases||[]].some(o=>t.includes(o.toLowerCase())));return n?`**${n.title}**${n.status?` (${n.status})`:""}

