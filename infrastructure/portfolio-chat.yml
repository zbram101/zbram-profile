aiser Permanente",role:"Software Engineer",period:"Oct 2018 \u2013 Sep 2021",description:"Built web applications and services, improved engineering quality, and championed test automation.",image:"images/Kaiser.png",responsibilities:["Built Angular components and corresponding services for a single-page application.","Developed and customized Adobe Experience Manager components to meet project requirements.","Reviewed code, identified functional gaps, and resolved issues across the software development lifecycle.","Designed service architectures with the team lead and translated designs into working code.","Collaborated with product managers, UI/UX designers, technical specialists, and business stakeholders.","Mentored developers and trained teams to maintain SSIS integrations; created a departmental training and internal certification program."]},{company:"Infostretch",role:"Automation Engineer",period:"Oct 2015 \u2013 Sep 2018",description:"Built enterprise test automation and continuous delivery capabilities for Kaiser Permanente.",image:"images/Kaiser.png",responsibilities:["Translated business requirements into test cases and automated approximately 94% of them.","Built the KP testing framework to standardize testing across teams within the organization.","Integrated automated tests into deployment workflows to give developers faster feedback.","Developed CI/CD proofs of concept for deploying validated features across environments without manual intervention.","Automated test-status updates in Quality Center so business stakeholders could monitor development progress.","Investigated issues across frontend code, content, service data, and external dependencies."]},{company:"UST Global",role:"Senior Systems Analyst (full time)",period:"Oct 2014 \u2013 Sep 2015",additionalRole:"Data Engineer (contract) \xB7 Jul 2013 \u2013 Oct 2014",description:"Built data tools, integrations, and automation to reduce operational effort.",image:"images/Anthem.jpeg",responsibilitie