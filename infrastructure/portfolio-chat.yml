AWSTemplateFormatVersion: '2010-09-09'
Description: Server-side portfolio chat API. The OpenAI credential is resolved from Secrets Manager during deployment.

Parameters:
  OpenAISecretName:
    Type: String
    Default: OAIprofile
    MaxLength: 512
    AllowedPattern: '[a-zA-Z0-9/_+=.@-]+'
    Description: Existing server-side Secrets Manager secret containing an OpenAI key from the saved agent's project.
  SavedAgentId:
    Type: String
    Default: ''
    MaxLength: 64
    AllowedPattern: '(^$|[a-zA-Z0-9_-]+)'
    Description: Saved OpenAI portfolio agent ID. When set, new sessions use its portal configuration.
  AgentModel:
    Type: String
    Default: gpt-6-astra
    AllowedPattern: '[a-zA-Z0-9._-]+'
    Description: Agents API model enabled for the OpenAI project.
  ChatBackend:
    Type: String
    Default: agents
    AllowedValues: [agents, responses]
    Description: Use responses for a temporary rollback to the previous chat.
  BookingUrl:
    Type: String
    Default: ''
    MaxLength: 1000
    AllowedPattern: '(^$|https://[^\s]+)'
    Description: Public booking page URL. Leave empty to prepare LinkedIn meeting requests.
  MeetingDetails:
    Type: String
    Default: ''
    MaxLength: 1200
    Description: Owner-approved meeting length, time zone, hours, and confirmation rules.
  GoogleCalendarSecretName:
    Type: String
    Default: ''
    MaxLength: 512
    AllowedPattern: '(^$|[a-zA-Z0-9/_+=.@-]+)'
    Description: Existing Secrets Manager secret name containing clientId, clientSecret, refreshToken, and calendarId. Leave blank to disable Google Calendar.
  GoogleCalendarRules:
    Type: String
    Default: ''
    MaxLength: 2000
    Description: Owner-approved scheduling rules as JSON. Leave blank until meeting hours are approved.

Conditions:
  HasGoogleCalendar: !Not [!Equals [!Ref GoogleCalendarSecretName, '']]

Resources:
  ChatRateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-chat'
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex

  VisitorAnalyticsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
        - AttributeName: visitorHash
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
        - AttributeName: visitorHash
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex

  ChatRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex
      Policies:
        - PolicyName: WriteChatLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ChatLogGroup.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt VisitorAnalyticsTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ChatRateLimitTable.Arn

  ChatFunction:
    Type: AWS::Lambda::Function
    DependsOn: ChatLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-chat'
      Description: Answers portfolio questions with OpenAI, using a server-side Secrets Manager reference.
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt ChatRole.Arn
      MemorySize: 256
      Timeout: 25
      ReservedConcurrentExecutions: 3
      Tags:
        - Key: Application
          Value: zbramprofile
        - Key: ManagedBy
          Value: Codex
      Environment:
        Variables:
          OPENAI_SECRET: !Sub '{{resolve:secretsmanager:${OpenAISecretName}:SecretString}}'
          OPENAI_MODEL: gpt-4.1-mini
          OPENAI_AGENT_MODEL: !Ref AgentModel
          OPENAI_AGENT_ID: !Ref SavedAgentId
          CHAT_BACKEND: !Ref ChatBackend
          BOOKING_URL: !Ref BookingUrl
          MEETING_DETAILS: !Ref MeetingDetails
          GOOGLE_CALENDAR_SECRET: !If [HasGoogleCalendar, !Sub '{{resolve:secretsmanager:${GoogleCalendarSecretName}:SecretString}}', '']
          GOOGLE_CALENDAR_RULES: !Ref GoogleCalendarRules
          CHAT_RATE_TABLE: !Ref ChatRateLimitTable
          VISITOR_TABLE: !Ref VisitorAnalyticsTable
      Code:
        ZipFile: |
